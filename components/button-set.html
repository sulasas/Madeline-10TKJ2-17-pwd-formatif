<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kumpulan Tombol</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: rgba(255, 230, 240, 0.5);
        }

        h2 {
            color: rgb(120, 80, 100);
            font-size: 20px;
        }

        .button-group {
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #D986A5;
            color: white;
        }

        .btn-primary:hover {
            background-color: #B96B89;
        }

        .btn-secondary {
            background-color: #E9B8C8;
            color: #4A3540;
        }

        .btn-secondary:hover {
            background-color: #D99BAF;
        }

        .btn-outline {
            background-color: white;
            border: 2px solid #766CA8;
            color: #766CA8;
        }

        .btn-outline:hover {
            background-color: #766CA8;
            color: white;
        }

        .btn-send {
            background-color: #B88E9F;
            color: white;
        }

        .btn-send:hover {
            background-color: #987083;
            }

        .btn-secondary,
        .btn-outline {
            color: #4A3540;
        }
    </style>

</head>
<body>

    <main>

        <h2>Kumpulan Tombol</h2>

        <div class="button-group">

            <a href="#" class="btn btn-primary">
                Lihat Proyek
            </a>

            <a href="#" class="btn btn-secondary">
                Unduh CV
            </a>

            <a href="#" class="btn btn-outline">
                Hubungi Saya
            </a>

            <a href="#" class="btn btn-send">
                Kirim Pesan
            </a>

        </div>

    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
