<!--
  Hitungan lebar kartu jika box-sizing tidak diatur (content-box):
  lebar 320 px + padding kiri-kanan (20 + 20) + border kiri-kanan (2 + 2)
  = 320 + 40 + 4 = 364 px.
  Karena memakai box-sizing: border-box, lebar kartu tepat 320 px.
-->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Proyek</title>

  <style>
    /* Universal: semua elemen memakai border-box */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #f4f6f8;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 320px;
      padding: 20px;
      border: 2px solid #333333;
      margin: 30px auto;
      background-color: #ffffff;
    }

    .card img {
      display: block;
      width: 100%;
      height: 160px;
    }

    .card h3 {
      color: #222222;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 15px;
    }

    .card a {
      color: #0b6bcb;
    }

    footer {
      text-align: center;
      padding: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img src="../assets/images/project.jpg" alt="Gambar proyek">
      <h3>[Judul proyekmu]</h3>
      <p>[Kalimat 1: jelaskan proyek atau hobimu.] [Kalimat 2: apa yang kamu pelajari atau sukai darinya.]</p>
      <a href="#">Lihat Proyek</a>
    </div>
  </main>

  <footer>
    <a href="../index.html">Kembali ke Beranda</a>
  </footer>
</body>
</html>
