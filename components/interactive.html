<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link dan Tombol yang Bergerak Halus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/interactive.css">
</head>
<body>
  <main>
    <!-- Keadaan biasa -->
    <section>
      <h2>Keadaan biasa</h2>
      <nav class="menu">
        <a href="#">Beranda</a>
        <a href="#">Tentang</a>
        <a href="#">Proyek</a>
        <a href="#">Kontak</a>
      </nav>
      <div class="button-row">
        <a href="#" class="btn btn-grow">Lihat Proyek</a>
        <a href="#" class="btn btn-darken">Hubungi Saya</a>
      </div>
    </section>

    <!-- Keadaan hover (dipaksa dengan class is-hover agar terlihat di screenshot) -->
    <section>
      <h2>Hover</h2>
      <nav class="menu">
        <a href="#">Beranda</a>
        <a href="#" class="is-hover">Tentang</a>
        <a href="#">Proyek</a>
        <a href="#">Kontak</a>
      </nav>
      <div class="button-row">
        <a href="#" class="btn btn-grow is-hover">Lihat Proyek</a>
        <a href="#" class="btn btn-darken is-hover">Hubungi Saya</a>
      </div>
    </section>
  </main>

  <footer>
    <a href="../index.html">Kembali ke Beranda</a>
  </footer>
</body>
</html>
